[alembic]
script_location = alembic
prepend_sys_path = .
# AP-0056: las migraciones usan la cuenta de despliegue (db_ddladmin), nunca sa ni la cuenta de runtime. Password inyectado en despliegue.
sqlalchemy.url = mssql+aioodbc://sufi_deploy:<SUFI_DEPLOY_PWD>@127.0.0.1:1433/sufiatulado?driver=ODBC+Driver+17+for+SQL+Server&TrustServerCertificate=yes

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
