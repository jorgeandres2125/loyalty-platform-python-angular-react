# AP-0134 - Alertas por consulta en Splunk (SPL). Cada stanza es una saved search
# programada con condicion de alerta. Ajuste index y campos al sourcetype real.

[AP-0134 R1 Fuerza bruta]
search = index=sufi_seguridad evento_seguridad=autenticacion resultado=fallo | bucket _time span=5m | stats count as intentos by actor,_time | where intentos>=5
dispatch.earliest_time = -5m@m
cron_schedule = */5 * * * *
alert.severity = 4
alert.suppress = 1
alert.suppress.fields = actor

[AP-0134 R2 Password spray]
search = index=sufi_seguridad evento_seguridad=autenticacion resultado=fallo | bucket _time span=10m | stats dc(actor) as usuarios by ip,_time | where usuarios>=10
dispatch.earliest_time = -10m@m
cron_schedule = */10 * * * *
alert.severity = 5

[AP-0134 R3 Acceso tras bloqueo]
search = index=sufi_seguridad (detalle=cuenta_bloqueada OR detalle=cuenta_inhabilitado OR detalle=cuenta_eliminado)
dispatch.earliest_time = -5m@m
cron_schedule = */5 * * * *
alert.severity = 4

[AP-0134 R5 403 en rafaga]
search = index=sufi_seguridad evento_seguridad=autorizacion resultado=fallo | bucket _time span=5m | stats count as denegaciones by actor,_time | where denegaciones>=10
dispatch.earliest_time = -5m@m
cron_schedule = */5 * * * *
alert.severity = 4