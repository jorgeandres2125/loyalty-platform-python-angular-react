# AP-0134: recolecta el JSON estructurado de sufi.seguridad (AP-0027, driver json-file) y lo
# envia a la plataforma de logs centralizada. Filtra por el logger de seguridad para reducir
# volumen. TLS obligatorio; el host y las credenciales llegan por variables de entorno.
[SERVICE]
    Flush        5
    Log_Level    info
    Parsers_File parsers.conf

[INPUT]
    Name   tail
    Path   /var/log/containers/*sufi*.log
    Tag    sufi.seguridad
    Parser docker_json

[FILTER]
    Name   grep
    Match  sufi.seguridad
    Regex  logger sufi.seguridad

[OUTPUT]
    Name             opensearch
    Match            sufi.seguridad
    Host             ${OPENSEARCH_HOST}
    Port             443
    HTTP_User        ${OPENSEARCH_USER}
    HTTP_Passwd      ${OPENSEARCH_PASSWORD}
    Index            sufi-seguridad
    Suppress_Type_Name On
    tls              On