# AP-0081: autoescalado horizontal -- ajusta el numero de replicas segun la carga,
# manteniendo la redundancia minima (minReplicas=3) y absorbiendo picos.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sufi-backend-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sufi-backend
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70